name: CI/CD

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    lint:
        name: lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Frontend: ESLint (config in frontend/eslint.config.js)
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - name: Install frontend dependencies
              working-directory: frontend
              run: npm ci
            - name: Lint frontend
              working-directory: frontend
              run: npm run lint

            # Backend: Ruff (config in backend/pyproject.toml)
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: backend/requirements-dev.txt
            - name: Install backend dependencies
              working-directory: backend
              run: pip install -r requirements-dev.txt
            - name: Lint backend
              working-directory: backend
              run: ruff check .

    build:
        name: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Frontend cachiranje key = package-lock.json
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - name: Install frontend dependencies
              working-directory: frontend
              run: npm ci
            - name: Build frontend
              working-directory: frontend
              run: npm run build
            - name: Upload frontend build
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-dist
                  path: frontend/dist/
                  if-no-files-found: error

            # Backend: cachiranje dependencijev v requirements.txt
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: backend/requirements.txt
            - name: Install backend dependencies
              working-directory: backend
              run: pip install -r requirements.txt
            - name: Build backend (Django checks and static files)
              working-directory: backend
              env:
                  # manage.py check and collectstatic se ne povezeta na DB, ampk settings.py se vseeno rabi da spremenljivke obstajajo
                  DB_NAME: rollcall
                  DB_USER: rollcall
                  DB_PASSWORD: rollcall
                  DB_PORT: "5432"
              run: |
                  python manage.py check
                  python manage.py collectstatic --noinput
            - name: Upload backend build
              uses: actions/upload-artifact@v4
              with:
                  name: backend-build
                  path: |
                      backend/
                      !backend/**/__pycache__/
                      !backend/requirements-dev.txt
                      !backend/pyproject.toml
                  if-no-files-found: error
