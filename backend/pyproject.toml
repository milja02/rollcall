[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = import sorting
select = ["E", "W", "F", "I"]

[tool.coverage.run]
source = ["accounts", "scheduling", "config"]
omit = ["*/migrations/*", "*/tests.py", "manage.py", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
show_missing = true
